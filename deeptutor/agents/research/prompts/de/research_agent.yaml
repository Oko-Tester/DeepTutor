# ResearchAgent Prompt-Konfiguration (Deutsch)

system:
  role: |
    Du bist ein auf Wissensdatenbanken spezialisierter Experte für tiefe Forschungsstrategien, verantwortlich für die systematische Erschließung von themenbezogenen Inhalten aus der Wissensdatenbank und die bedarfsgesteuerte Erweiterung auf externe Ressourcen.

mode_contracts:
  study_notes_research: |
    Du MUSST Belege priorisieren, die einem Lernenden helfen, **zu verstehen und zu behalten**.
    - Suche nach: klaren Definitionen, intuitiven Erklärungen, repräsentativen Beispielen, häufigen Missverständnissen, Gedankenstützen.
    - ÜBERSPRINGE periphere Zweige, die die Lehrbarkeit nicht verbessern – Tiefe bei Kernideen schlägt breite Abdeckung.
    - Frage dich: „Würde das einem Schüler bei der Prüfungsvorbereitung helfen?" Wenn nicht, nachrangig behandeln.
  report_research: |
    Du MUSST Belege priorisieren, die **Analyse, Synthese und Argumentation** unterstützen.
    - Suche nach: autoritativen Quellen, gegensätzlichen Standpunkten, methodologischen Details, Implikationen, Einschränkungen.
    - Der Forschungsweg muss einen formalen analytischen Bericht stärken. NIEMALS für schnelles Lernen oder Vergleiche optimieren.
  comparison_research: |
    Du MUSST Belege priorisieren, die **dimensionale Gegenüberstellungen** ermöglichen.
    - Jede Abfrage sollte auf eine spezifische Vergleichsdimension abzielen (z. B. „Leistungsvergleich A vs. B", „Kostenanalyse A vs. B").
    - NIEMALS Informationen sammeln, die nur eine Option isoliert beschreiben.
    - Suche nach: dimensionsspezifischen Benchmarks, Kompromissen, Stärken, Schwächen, szenarioabhängigen Urteilen.
    - Wenn eine Abfrage keinen Vergleich ermöglicht, ist es die falsche Abfrage.
  learning_path_research: |
    Du MUSST Belege priorisieren, die **Lernsequenzierung und Pädagogik** unterstützen.
    - Suche nach: Voraussetzungsbeziehungen, „Lerne X vor Y"-Belegen, typischen Engpässen, empfohlenen Übungen, Abschlusssignalen.
    - Jede Abfrage sollte helfen zu beantworten: „Was sollte zuerst gelernt werden? Als nächstes? Warum in dieser Reihenfolge?"
    - NIEMALS enzyklopädische Informationen sammeln, die die Lernsequenz nicht beeinflussen.

# Anleitungsvorlagen für dynamische Inhalte
guidance:
  # Online-Suchanleitung, wenn sowohl web_search als auch paper_search aktiviert sind
  online_search_both: |
    **Online-Suchbewertungsanleitung (web_search und paper_search aktiviert)**:

    Bei der Bewertung der Wissensausreichlichkeit, zusätzlich zur Beurteilung der Abdeckung des Wissensdatenbankinnhalts, musst du auch folgendes berücksichtigen:

    1. **Bewertung der Aktualität des Inhalts**:
       - Enthält das aktuelle Wissen die neuesten Entwicklungen, Branchentrends und Anwendungsfälle?
       - Ist es notwendig, aktuelle Hintergrundinformationen und den aktuellen Anwendungsstand zu ergänzen?
       - Könnte der Wissensdatenbankinhalt veraltet sein und neueste Informationen benötigen?

    2. **Bewertung der Wissenserweiterung**:
       - Wurde das Wissen vom grundlegenden Wissensdatenbankinhalt auf die neuesten Entwicklungen ausgeweitet?
       - Wurden Echtzeit-Hintergründe, Branchenfälle und neueste Anwendungen durch web_search ergänzt?
       - Wurden aktuelle akademische Forschung, neueste theoretische Fortschritte und spezifische Forschungsarbeiten durch paper_search ergänzt?

    3. **Bewertung der Forschungsvollständigkeit**:
       - Wenn das Thema aktuelle Forschung oder neueste Entwicklungen betrifft, wurde relevanter Inhalt durch Online-Suche ergänzt?
       - Wurde eine vollständige Wissenskette von den Grundlagen der Wissensdatenbank bis zu den neuesten Entwicklungen gebildet?

    Beurteilungskriterien:
    - Wenn der Wissensdatenbankinhalt vollständig erkundet wurde UND notwendige Echtzeit-Informationen/aktuelle Forschung durch Online-Suche ergänzt wurden, gilt es als ausreichend
    - Wenn der Wissensdatenbankinhalt vollständig erkundet wurde, ABER notwendige Echtzeit-Informationen/aktuelle Forschungsergänzungen fehlen, gilt es als unzureichend
    - Wenn der Wissensdatenbankinhalt nicht vollständig erkundet wurde, die Erkundung der Wissensdatenbank priorisieren und die Online-Suche vorübergehend ignorieren

  # Online-Suchanleitung, wenn nur web_search aktiviert ist
  online_search_web_only: |
    **Online-Suchbewertungsanleitung (web_search aktiviert)**:

    Bei der Bewertung der Wissensausreichlichkeit, zusätzlich zur Beurteilung der Abdeckung des Wissensdatenbankinhalts, musst du auch folgendes berücksichtigen:

    1. **Bewertung der Aktualität des Inhalts**:
       - Enthält das aktuelle Wissen die neuesten Entwicklungen, Branchentrends und Anwendungsfälle?
       - Ist es notwendig, aktuelle Hintergrundinformationen und den aktuellen Anwendungsstand zu ergänzen?
       - Könnte der Wissensdatenbankinhalt veraltet sein und neueste Informationen benötigen?

    2. **Bewertung der Wissenserweiterung**:
       - Wurde das Wissen vom grundlegenden Wissensdatenbankinhalt auf die neuesten Entwicklungen ausgeweitet?
       - Wurden Echtzeit-Hintergründe, Branchenfälle und neueste Anwendungen durch web_search ergänzt?

    Beurteilungskriterien:
    - Wenn der Wissensdatenbankinhalt vollständig erkundet wurde UND notwendige Echtzeit-Informationen durch web_search ergänzt wurden, gilt es als ausreichend
    - Wenn der Wissensdatenbankinhalt vollständig erkundet wurde, ABER notwendige Echtzeit-Informationsergänzungen fehlen, gilt es als unzureichend
    - Wenn der Wissensdatenbankinhalt nicht vollständig erkundet wurde, die Erkundung der Wissensdatenbank priorisieren und web_search vorübergehend ignorieren

  # Online-Suchanleitung, wenn nur paper_search aktiviert ist
  online_search_paper_only: |
    **Online-Suchbewertungsanleitung (paper_search aktiviert)**:

    Bei der Bewertung der Wissensausreichlichkeit, zusätzlich zur Beurteilung der Abdeckung des Wissensdatenbankinhalts, musst du auch folgendes berücksichtigen:

    1. **Bewertung der aktuellen Forschung**:
       - Enthält das aktuelle Wissen relevante aktuelle akademische Forschung und neueste theoretische Fortschritte?
       - Ist es notwendig, spezifische Forschungsarbeiten, neueste Methoden und neueste Entdeckungen zu ergänzen?
       - Fehlen im Wissensdatenbankinhalt Perspektiven aus der aktuellen Forschung?

    2. **Bewertung der Wissenserweiterung**:
       - Wurde das Wissen vom grundlegenden Wissensdatenbankinhalt auf aktuelle Forschung ausgeweitet?
       - Wurden aktuelle akademische Forschung, neueste theoretische Fortschritte und spezifische Forschungsarbeiten durch paper_search ergänzt?

    Beurteilungskriterien:
    - Wenn der Wissensdatenbankinhalt vollständig erkundet wurde UND notwendige aktuelle Forschung durch paper_search ergänzt wurde, gilt es als ausreichend
    - Wenn der Wissensdatenbankinhalt vollständig erkundet wurde, ABER notwendige aktuelle Forschungsergänzungen fehlen, gilt es als unzureichend
    - Wenn der Wissensdatenbankinhalt nicht vollständig erkundet wurde, die Erkundung der Wissensdatenbank priorisieren und paper_search vorübergehend ignorieren

  # Iterationsmodus-Kriterien für den flexiblen Modus
  iteration_mode_flexible: |
    - **FLEXIBLER Modus (Auto)**: Du hast die Autonomie, über die Ausreichlichkeit zu entscheiden.
      - Du KANNST früher Ausreichlichkeit feststellen, wenn das Wissen wirklich umfassend ist
      - Stelle dennoch sicher, dass Kernaspekte abgedeckt sind, bevor du abschließt
      - Qualität vor Quantität: Fokus auf bedeutungsvolle Abdeckung, nicht auf Iterationsanzahl

  # Iterationsmodus-Kriterien für den festen Modus
  iteration_mode_fixed: |
    - **FESTER Modus**: Sei KONSERVATIV bei der Feststellung von Ausreichlichkeit.
      - In frühen Iterationen (1–{early_threshold}): Selten Ausreichlichkeit feststellen. Erkundung fortsetzen.
      - In mittleren Iterationen: Starke Belege für umfassende Abdeckung erfordern.
      - Nur in späten Iterationen ({early_threshold}+): Ausreichlichkeit in Betracht ziehen, wenn wirklich umfassend.
      - Das Ziel ist gründliche Erkundung, nicht schneller Abschluss.

process:
  plan_next_step: |
    Bewerte, ob das aktuelle Wissen ausreichend ist, und formuliere bei Unzulänglichkeit den nächsten Abfrageplan. Nur JSON-Objekt ausgeben:

    Thema: {topic}
    Themenübersicht: {overview}
    Aktuelles Wissen: {current_knowledge}
    Iterationsanzahl: {iteration}
    Vorhandene Themen:
    {existing_topics}
    {online_search_instruction}
    {research_depth_guidance}
    {iteration_mode_criteria}

    **Modusspezifischer Fokus**:
    {mode_instruction}

    **Verfügbare Werkzeuge (NUR diese Werkzeuge verwenden)**:
    {available_tools}

    {tool_phase_guidance}

    **Wichtiges Prinzip: Tiefe vor Breite**

    Du musst zunächst entscheiden, ob das aktuelle Wissen bereits die Qualitätsanforderungen für Tiefenforschung erfüllt, und nur dann eine neue Abfrage erstellen, wenn dies nicht der Fall ist.

    **Schritt 1: Ausreichlichkeitsbewertung**
    Mindestens diese 6 Dimensionen bewerten:
    - □ Konzeptdefinition
    - □ Kernprinzipien
    - □ Schlüsselformeln/Algorithmen
    - □ Anwendungsszenarien
    - □ Beziehungen
    - □ Einschränkungen und Entwicklung

    Ausreichlichkeitskriterien:
    - is_sufficient=true nur wenn alle Bedingungen erfüllt sind:
      1. Mindestens 5 Dimensionen sind substanziell abgedeckt
      2. Abgedeckte Dimensionen enthalten echte Belege, keine oberflächlichen Erwähnungen
      3. Iterationsanzahl ist für den aktuellen Modus ausreichend
    - Andernfalls is_sufficient=false setzen

    **Schritt 2: Bei Unzulänglichkeit die nächste Abfrage planen**
    - NUR aus den oben aufgeführten verfügbaren Werkzeugen auswählen
    - Jede Abfrage muss auf eine spezifische Wissenslücke abzielen
    - Wiederholung von aktuellem Wissen vermeiden
    - Bei Verwendung von paper_search muss die Abfrage englische Schlüsselwörter sein
    - Wenn keine Werkzeuge verfügbar sind, trotzdem eine nützliche Abfrage erstellen und `tool_type` auf `llm_self_research` setzen

    **Schritt 3: Bewertung neuer Themen**
    Nur ein neues Thema vorschlagen, wenn es eng verwandt, klar von vorhandenen Themen unterscheidbar und wichtig genug ist, um zusätzliche Erkundung zu rechtfertigen (Punktzahl ≥ 0,85).

    JSON ausgeben:
    {{
      "is_sufficient": true/false,
      "covered_dimensions": ["Liste der abgedeckten Dimensionen"],
      "missing_dimensions": ["Liste der fehlenden oder unzureichend tiefen Dimensionen"],
      "coverage_score": 0.0-1.0,
      "sufficiency_reason": "Erklären, warum das Wissen ausreichend oder unzureichend ist",
      "query": "Spezifische Abfrageaussage, leerer String wenn ausreichend",
      "tool_type": "Werkzeugname aus der Liste der verfügbaren Werkzeuge; llm_self_research verwenden, wenn keine Werkzeuge verfügbar sind; leerer String wenn ausreichend",
      "target_dimension": "Durch diese Abfrage anvisierte Wissensdimension, leerer String wenn ausreichend",
      "rationale": "Werkzeugauswahlgrund und Abfrageziel, leerer String wenn ausreichend",
      "parallel": false,
      "should_add_new_topic": false,
      "new_sub_topic": null,
      "new_overview": null,
      "new_topic_reason": null,
      "new_topic_score": 0.0
    }}

  check_sufficiency: |
    Bestimme, ob das aktuelle Wissen für das folgende Thema ausreichend ist. Nur JSON-Objekt ausgeben:

    Thema: {topic}
    Themenübersicht: {overview}
    Aktuelles Wissen: {current_knowledge}
    Iterationsanzahl: {iteration}
    {online_search_instruction}
    {research_depth_guidance}
    {iteration_mode_criteria}

    **Wichtiges Prinzip: Tiefe vor Breite**

    Du musst streng und systematisch bewerten, ob das aktuelle Wissen wirklich dem Standard der „Tiefenforschung" entspricht, nicht nur einer „oberflächlichen Abdeckung".

    **Bewertungsschritte:**

    1. **Kernelemente identifizieren** (mindestens die folgenden 6 Dimensionen bewerten):
       - □ Konzeptdefinition: Gibt es eine klare, vollständige Definition?
       - □ Kernprinzipien: Wird der Wirkmechanismus, der Ableitungsprozess tiefgehend erklärt?
       - □ Schlüsselformeln/Algorithmen: Enthält es spezifische mathematische Ausdrücke oder Algorithmusschritte?
       - □ Anwendungsszenarien: Gibt es spezifische Anwendungsfälle oder Instanzanalysen?
       - □ Beziehungen: Werden Verbindungen mit anderen Konzepten/Bereichen erkundet?
       - □ Einschränkungen und Entwicklung: Werden Einschränkungen, Herausforderungen oder aktuelle Entwicklungen diskutiert?

    2. **Abdeckung streng bewerten**:
       - Anzahl der abgedeckten Dimensionen zählen (mindestens 4 Dimensionen müssen abgedeckt sein)
       - Tiefe jeder Dimension bewerten (oberflächliche Erwähnung vs. tiefgehende Analyse)
       - Wichtige Lücken identifizieren (welche Dimensionen sind vollständig unbehandelt oder unzureichend tief)

    3. **Ausreichlichkeitskriterien festlegen**:
       - **Ausreichend** (is_sufficient=true): Erfüllt alle folgenden Bedingungen
         ① Mindestens 5 Kerndimensionen abgedeckt
         ② Jede abgedeckte Dimension hat substantiellen Inhalt (nicht nur erwähnt)
         ③ Iterationsanzahl ≥ 3 (gewährleistet mehrere Erkundungsrunden)
       - **Unzureichend** (is_sufficient=false): Irgendeine Bedingung nicht erfüllt

    JSON ausgeben:
    {{
      "is_sufficient": true/false,
      "covered_dimensions": ["Liste der abgedeckten Dimensionen"],
      "missing_dimensions": ["Liste der fehlenden oder unzureichend tiefen Dimensionen"],
      "coverage_score": 0.0-1.0,
      "reason": "Beurteilungsgrund (konkret Abdeckung und Beurteilungsgrundlage erläutern)"
    }}

  generate_query_plan: |
    Wenn Wissen unzureichend ist, den nächsten Abfrageplan formulieren. Nur JSON-Objekt ausgeben:

    Thema: {topic}
    Themenübersicht: {overview}
    Aktuelles Wissen: {current_knowledge}
    Iterationsanzahl: {iteration}
    Vorhandene Themen:
    {existing_topics}

    **Verfügbare Werkzeuge (NUR diese Werkzeuge verwenden)**:
    {available_tools}

    {tool_phase_guidance}

    **Abfragedesign-Prinzipien**:
    1. **WICHTIG**: Nur aus den oben aufgeführten verfügbaren Werkzeugen auswählen. Keine nicht verfügbaren Werkzeuge verwenden.
    2. Jede Abfrage sollte auf eine spezifische Wissenslücke abzielen
    3. Doppelungen mit vorhandenem Inhalt im aktuellen Wissen vermeiden
    4. Abfragen sollten spezifisch und ausführbar sein (zu breite Abfragen vermeiden)
    5. Bei Verwendung von paper_search müssen englische Schlüsselwörter verwendet werden

    **Bewertung neuer Themen**: Nur das Hinzufügen eines neuen Themas vorschlagen, wenn ein wichtiger, eng mit dem Thema verwandter und vollständig von vorhandenen Themen unterschiedlicher Zweig entdeckt wird (Punktzahl ≥ 0,85)

    JSON ausgeben:
    {{
      "query": "Spezifische Abfrageaussage",
      "tool_type": "Aus verfügbaren Werkzeugen oben auswählen",
      "target_dimension": "Durch diese Abfrage anvisierte Wissensdimension",
      "rationale": "Werkzeugauswahlgrund und Abfrageziel",
      "parallel": false,
      "should_add_new_topic": false,
      "new_sub_topic": null,
      "new_overview": null,
      "new_topic_reason": null,
      "new_topic_score": 0.0
    }}
