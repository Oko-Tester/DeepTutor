  write_introduction_learning_path: |
    Den „Für wen dieser Pfad gedacht ist"-Abschnitt eines Lernpfads schreiben.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben.**

    Thema: {topic}
    Lernerleitfaden: {introduction_instruction}
    Themenüberblick: {topics_summary}
    Gesamtanzahl Themen: {total_topics}

    **Regeln**:
    - Definieren: (a) Ziellernendenprofil, (b) Vorwissen, (c) was der Lernende nach Abschluss des Pfads tun können wird, (d) geschätzte Zeit/Aufwand.
    - Ein strukturiertes Format mit fettgedruckten Bezeichnungen verwenden.
    - Unter 300 Wörtern halten. Spezifisch und handlungsorientiert sein.

    Ausgabe:
    {{
        "introduction": "**Ziellernender**: ...\n\n**Voraussetzungen**: ...\n\n**Nach Abschluss dieses Pfads**: ...\n\n**Geschätzter Aufwand**: ..."
    }}

    **Jetzt direkt das JSON-Objekt ausgeben.**

  write_section_body_learning_path: |
    Einen Lernstufenabschnitt schreiben. Die Ausgabe muss sich wie eine strukturierte Lehrplansstufe lesen — KEIN Berichtskapitel.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben.**

    Thema: {topic}
    Abschnittstitel: {section_title}
    Schreibleitfaden: {section_instruction}
    Datenquelle: {block_data}

    **Lernpfad-Stufenregeln** (VERBINDLICH):

    1. **Stufen-Metadaten**: Jede Stufe beginnen mit:
       ```
       > ⏱️ **Geschätzte Zeit**: X Stunden
       > 📊 **Schwierigkeitsgrad**: Grundlagen / Fortgeschritten / Experte
       ```
    2. **Lernziele**: Eine Aufzählungsliste: „Nach dieser Stufe wirst du in der Lage sein: …"
    3. **Warum jetzt**: Kurz die Voraussetzungskette erläutern — warum diese Stufe an diesem Punkt kommt.
    4. **Kerninhalt**: Die Schlüsselkonzepte lehren. Definitionsboxen, Beispiele, Diagramme und Code nach Bedarf verwenden. Erklärungen klar und progressiv halten.
    5. **Übungsplan**: Spezifische Übungen, Mini-Projekte oder zu lösende Probleme einbeziehen:
       ```
       > 📝 **Übung**: Beschreibung der Aufgabe, erwartetes Ergebnis und wie man die Antwort überprüft.
       ```
    6. **Empfohlene Ressourcen**: Bücher, Kurse, Tools oder Links vorschlagen:
       ```
       > 📚 **Ressourcen**: [Liste empfohlener Materialien]
       ```
    7. **Kontrollpunkt**: Mit einem Selbstbewertungsblock enden:
       ```
       > ✅ **Kontrollpunkt — Bereit für Stufe N+1?**
       > - Kannst du X erklären?
       > - Kannst du Y implementieren?
       > - Kannst du erkennen, wann Z gilt?
       ```
    8. **NIEMALS** wie ein Berichtsabschnitt schreiben. Jeder Absatz soll dem Lernenden helfen zu HANDELN, nicht nur zu verstehen.

    {citation_instruction}

    Ausgabe:
    {{
        "section_content": "## Stufe N. Titel\n\n> ⏱️ **Geschätzte Zeit**: X Stunden\n> 📊 **Schwierigkeitsgrad**: Fortgeschritten\n\n**Lernziele**:\n- ...\n\n**Warum jetzt**: ...\n\n### Kerninhalt\n...\n\n> 📝 **Übung**: ...\n\n> 📚 **Ressourcen**: ...\n\n> ✅ **Kontrollpunkt — Bereit für Stufe N+1?**\n> - ...{citation_output_hint}"
    }}

    **Wortanzahl**: 500-800 Wörter pro Stufe.

    **Jetzt direkt das JSON-Objekt ausgeben.**

  write_conclusion_learning_path: |
    Den „Meilensteine & Was als nächstes"-Abschnitt für einen Lernpfad schreiben.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben.**

    Thema: {topic}
    Meilensteinleitfaden: {conclusion_instruction}
    Wichtige Erkenntnisse: {topics_findings}
    Gesamtanzahl Themen: {total_topics}

    **Regeln** (VERBINDLICH):
    - **Fahrplan-Diagramm**: Ein Mermaid-Flussdiagramm einbeziehen, das die Stufenprogression zeigt:
      ```mermaid
      graph LR
        A["Stufe 1: ..."] --> B["Stufe 2: ..."]
        B --> C["Stufe 3: ..."]
      ```
    - **Meilenstein-Checkliste**: Eine Tabelle für alle Stufen mit Zeitschätzungen:
      ```
      | Stufe | Meilenstein | Gesch. Zeit | Selbstcheck |
      |-------|-------------|-------------|-------------|
      | 1     | ...         | X Stunden   | Kannst du…? |
      ```
    - **Gesamtzeitschätzung**: Alle Stufenzeiten für den gesamten Pfad summieren.
    - **Selbstbewertung**: Dem Lernenden helfen, seine allgemeine Bereitschaft zu beurteilen.
    - **Was als nächstes**: Konkrete Ratschläge, wohin man nach Abschluss dieses Pfads gehen kann — fortgeschrittene Themen, Projekte, Gemeinschaften, Ressourcen.
    - **NIEMALS** eine formelle Schlussfolgerung mit „Einschränkungen" schreiben. Dies ist zukunftsorientiert und handlungsorientiert.

    Ausgabe:
    {{
        "conclusion": "**Lernfahrplan**\n\n```mermaid\ngraph LR\n  A[Stufe 1] --> B[Stufe 2]\n  B --> C[Stufe 3]\n```\n\n**Meilenstein-Checkliste**\n\n| Stufe | Meilenstein | Gesch. Zeit | Selbstcheck |\n|---|---|---|---|\n| ... | ... | X Stunden | ... |\n\n**Geschätzte Gesamtzeit**: X Stunden\n\n**Selbstbewertung**: ...\n\n**Was als nächstes**: ..."
    }}

    **Jetzt direkt das JSON-Objekt ausgeben.**

  write_full_report_learning_path: |
    Ein vollständiges Lernpfad-Dokument in einem Durchgang schreiben.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben.**

    Thema: {topic}
    Gliederungs-JSON:
    {outline_json}

    Block-Daten:
    {blocks_json}

    Gesamtanzahl Themen: {total_topics}

    Zitationsanweisung:
    {citation_instruction}

    **KRITISCH**: Die Ausgabe MUSS wie ein stufenweiser Lernlehrplan wirken, KEIN Bericht.

    **Verbindliche Elemente**:
    - „Für wen dieser Pfad gedacht ist"-Abschnitt mit Lernerprofil, Voraussetzungen, Endziel
    - Sequentielle Stufen (Stufe 1 → 2 → 3…), jeweils mit:
      - Stufen-Metadaten: `> ⏱️ **Geschätzte Zeit**: X Stunden` und `> 📊 **Schwierigkeitsgrad**: Grundlagen/Fortgeschritten/Experte`
      - Ziele, Warum-jetzt, Kerninhalt, Übung, empfohlene Ressourcen, Kontrollpunkt
    - Übungsblöcke: `> 📝 **Übung**: ...`
    - Ressourcenblöcke: `> 📚 **Ressourcen**: ...`
    - Kontrollpunktblöcke: `> ✅ **Kontrollpunkt**: ...`
    - „Meilensteine & Was als nächstes"-Abschnitt mit Mermaid-Fahrplan-Diagramm + Meilenstein-Tabelle + Gesamtzeitschätzung + Fortsetzungsratschläge
    - Klare Voraussetzungskette durchgehend sichtbar
    - NIEMALS als flacher thematischer Bericht schreiben

    Ausgabe:
    {{
      "report": "# Lernpfad: Titel\n\n## Für wen dieser Pfad gedacht ist\n...\n\n## Stufe 1. ...\n\n**Lernziele**:\n...\n\n> 📝 **Übung**: ...\n\n> ✅ **Kontrollpunkt**: ...\n\n## Meilensteine & Was als nächstes\n..."
    }}

    **Jetzt direkt das JSON-Objekt ausgeben.**
