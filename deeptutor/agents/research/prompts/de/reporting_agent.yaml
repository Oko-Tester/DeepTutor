  write_section_body_study_notes: |
    Einen Lernnotizen-Abschnitt schreiben. Die Ausgabe muss aussehen und sich anfühlen wie hochwertige Lernnotizen — KEIN Aufsatz oder Berichtskapitel.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben.**

    Thema: {topic}
    Abschnittstitel: {section_title}
    Schreibleitfaden: {section_instruction}
    Datenquelle: {block_data}

    **Lernnotizen-Schreibregeln** (VERBINDLICH):

    1. **Struktur**: Kurze Absätze, Aufzählungslisten, nummerierte Schritte und Callout-Blöcke verwenden. NIEMALS langen ununterbrochenen Fließtext schreiben.
    2. **Definitionsboxen**: Für jeden Schlüsselbegriff verwenden:
       ```
       > **Definition — Begriff**: Einzeilige Erklärung.
       ```
    3. **Mini-Beispiele**: Mindestens ein konkretes ausgearbeitetes Beispiel pro Abschnitt einbeziehen. Code-Blöcke, Mathematik oder schrittweise Erläuterungen nach Bedarf verwenden.
    4. **Fallstrick-Warnungen**: Häufige Fehler markieren mit:
       ```
       > ⚠️ **Häufiger Fehler**: Beschreibung des Fehlers und wie man ihn vermeidet.
       ```
    5. **Schlüsselerkenntnis-Block**: Jeden Abschnitt beenden mit:
       ```
       > 🔑 **Schlüsselerkenntnis**: Das eine, das man aus diesem Abschnitt mitnehmen sollte.
       ```
    6. **Tabellen**: Vergleichstabellen für kontrastierende Konzepte, Parameterzusammenfassungen oder Methodenvergleiche verwenden.
    7. **Formeln**: LaTeX beibehalten. Inline: `$...$`. Block: `$$...$$`.
    8. **Teste dich selbst**: Mit einer Mikrofrage enden, die das Erinnern testet:
       ```
       > 💡 **Teste dich selbst**: Kannst du <Konzept> erklären, ohne in die Notizen zu schauen?
       ```
    9. **Gedächtnisanker**: Wo hilfreich, eine Eselsbrücke, Analogie oder einen visuellen Hinweis bereitstellen:
       ```
       > 🧠 **Gedächtnisanker**: <Eselsbrücke oder Analogie zur Unterstützung des Erinnerns>
       ```
    10. **NIEMALS** wie ein Bericht schreiben: kein „In diesem Abschnitt untersuchen wir…", keine langen analytischen Abhandlungen, keine formellen Übergänge.

    {citation_instruction}

    Ausgabe:
    {{
        "section_content": "## Abschnittstitel\n\n> **Definition — X**: ...\n\n- Punkt 1\n- Punkt 2\n\n**Beispiel**:\n...\n\n> ⚠️ **Häufiger Fehler**: ...\n\n> 🧠 **Gedächtnisanker**: ...\n\n> 🔑 **Schlüsselerkenntnis**: ...\n\n> 💡 **Teste dich selbst**: ...{citation_output_hint}"
    }}

    **Wortanzahl**: 400-700 Wörter. Klarheit vor Länge priorisieren.

    **Jetzt direkt das JSON-Objekt ausgeben.**

