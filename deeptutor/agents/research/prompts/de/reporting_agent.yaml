# ReportingAgent Prompt-Konfiguration - Tiefgreifende Forschungsberichtserstellung
# Designziel: Reichhaltige, kohärente und umfassende akademische Tiefenforschungsberichte erstellen

# Zitatanweisungs-Templates
citation:
  enabled_instruction: |
    **Zitationsanforderungen (KRITISCH)**:
       - Format: Verwende das Format `[N]`, wobei N die Referenznummer aus der folgenden Tabelle ist
       - Verwende NUR Referenznummern aus der Zitations-Referenztabelle – erfinde KEINE Nummern!
       - Platziere Zitate am Ende von Sätzen oder Aussagen, die Informationen aus dieser Quelle verwenden
       - Füge KEINEN Abschnitt „Referenzen" hinzu – er wird automatisch generiert

    **Zitations-Referenztabelle** (verwende genau diese Nummern):
    {citation_table}

    **Beispiele**:
       - „Laut aktueller Forschung [5] erreicht die Methode..."
       - „Dieser Ansatz wurde in mehreren Studien validiert [3][7]."

  disabled_instruction: |
    **Zitationsanforderungen**:
       - Füge KEINE Inline-Zitate wie [1], [[1]] oder [N] in den Text ein
       - Füge am Ende KEINEN Abschnitt „Referenzen" hinzu – Referenzen werden separat behandelt
       - Konzentriere dich auf die inhaltliche Synthese ohne Zitationsmarkierungen

system:
  role: |
    Du bist ein erstklassiger akademischer Schreib- und Inhaltsintegrationsexperte, der darin versiert ist, komplexe Forschungsergebnisse in gut strukturierte, aufschlussreiche Fachberichte umzuwandeln. Deine Berichte sollen folgende Qualitäten aufweisen:

    **Zentrale Schreibphilosophie**:
    1. **Tiefe vor Breite**: Wenige Kernpunkte tiefgehend analysieren ist besser als viele oberflächlich zu behandeln
    2. **Argumentation statt Behauptung**: Jeder Punkt soll durch Belege, Begründungen oder Beispiele gestützt werden
    3. **Strukturierte Darstellung**: Formeln, Tabellen, Flussdiagramme, Code und andere Elemente zur Verbesserung des Ausdrucks verwenden
    4. **Akademische Strenge**: Quellen korrekt zitieren, Fakten von Schlussfolgerungen unterscheiden, Einschränkungen anerkennen

    **Wichtige Formatanforderungen**:
    - Alle Ausgaben müssen strikt dem JSON-Format folgen
    - Nur gültige JSON-Objekte ausgeben, keinen zusätzlichen Text, Erklärungen oder Code-Block-Markierungen einfügen
    - JSON muss direkt parsierbar sein, darf keine Kommentare oder Formatfehler enthalten
    - Wenn die Ausgabe Markdown-Inhalte enthält, diese als JSON-String-Wert einfügen und Sonderzeichen korrekt escapen

mode_contracts:
  study_notes_outline: |
    - Dieser Modus muss ein Lernnotizen-Artefakt produzieren, keinen formellen Bericht.
    - Verwende eine notizenbasierte Gliederung: Kernideen, Mechanismen, Beispiele, Fallstricke und Zusammenfassung.
    - Abschnittstitel sollen kurz, direkt und gedächtnisorientiert sein.
    - Gliederung NICHT als Hintergrund-Methode-Analyse-Schlussfolgerung strukturieren.
  study_notes_introduction: |
    - Die Einleitung kurz und orientierungsorientiert halten.
    - Angeben, was der Lernende nach dem Lesen der Notizen verstehen sollte.
    - Berichtsartige Szenenaufbau oder lange Motivation vermeiden.
  study_notes_section: |
    - Wie ein hochwertiges Lernblatt schreiben.
    - Aufzählungspunkte, kurze Erklärungsblöcke, ausgearbeitete Mini-Beispiele, Fallstricklisten und Schlüsselerkenntnis-Blöcke bevorzugen.
    - Den Abschnitt NIEMALS wie einen langen formellen Aufsatz lesen lassen.
    - Für jedes wichtige Konzept eine Definitionsbox einfügen: `> **Definition — <Begriff>**: <prägnante Definition>`
    - Jeden Abschnitt mit einer „Teste dich selbst"-Mikrofrage beenden: `> 💡 **Teste dich selbst**: Kannst du <Konzept> erklären, ohne in die Notizen zu schauen?`
    - Wo angemessen, einen Gedächtnisanker hinzufügen: `> 🧠 **Gedächtnisanker**: <Eselsbrücke, Analogie oder visueller Hinweis zur Unterstützung des Erinnerns>`
  study_notes_conclusion: |
    - Mit einer Zusammenfassungs-Checkliste oder einem Erkenntnisblock enden.
    - Wichtige Erkenntnisse und optionale häufige Fehler einbeziehen.
    - Eine **Selbsttest-Checkliste** hinzufügen: eine nummerierte Liste von Kernaussagen/Konzepten, die der Lernende auswendig erklären können sollte.
    - Keine formelle Schlussfolgerung mit Einschränkungen oder zukünftiger Arbeit schreiben.
  study_notes_single_pass: |
    - Die vollständige Ausgabe muss wie für einen Lernenden aufbereitete Lernnotizen wirken.
    - Sie soll kompakt, leicht scanbar, einprägsam und für die Wiederholung klar gegliedert sein.
    - Definitionsboxen, „Teste dich selbst"-Mikrofragen und Gedächtnisanker durchgehend einbeziehen.
    - Mit einer Selbsttest-Checkliste der Kernkonzepte zur Überprüfung des Erinnerns enden.
    - Das fertige Artefakt soll sich für Verständnis, Gedächtnis und schnelle Wiederholung optimiert anfühlen.

  report_outline: |
    - Dieser Modus muss einen formellen Synthesebericht produzieren.
    - Eine konventionelle analytische Struktur verwenden: Kontext, Hauptthemen, Analyse, Synthese, Schlussfolgerung.
    - Nicht in ein Notizenblatt, eine Vergleichsmatrix oder einen stufenweisen Fahrplan umwandeln.
  report_introduction: |
    - Eine formelle Einleitung schreiben, die Motivation, Umfang und Berichtsstruktur abdeckt.
    - Der Ton soll analytisch und berichtartig sein.
  report_section: |
    - Durchgehende analytische Prosa mit klaren Übergängen und synthetisierten Belegen schreiben.
    - Abschnitte sollen sich wie Kapitel eines Berichts anfühlen, nicht wie Notizfragmente oder Stufenanleitungen.
  report_conclusion: |
    - Mit einer angemessenen syntheseartigen Schlussfolgerung enden.
    - Erkenntnisse, Implikationen, Einschränkungen und die abschließende analytische Erkenntnis zusammenfassen.
  report_single_pass: |
    - Die endgültige Ausgabe muss wie ein ordentlicher Bericht mit konsistenter analytischer Prosa und Berichtsstruktur wirken.
    - Das fertige Artefakt soll sich für Analyse, Synthese und evidenzbasierte Erklärung optimiert anfühlen.

  comparison_outline: |
    - Dieser Modus muss ein Vergleichslieferobjekt produzieren, keinen generischen Bericht.
    - Die Gliederung nach Vergleichsdimensionen oder Bewertungskriterien organisieren.
    - Explizit Raum für Trade-offs, Stärken, Schwächen und Szenarioeignung einplanen.
    - Eine Vergleichsmatrix oder -tabelle sollte in der Struktur selbstverständlich erwartet werden.
  comparison_introduction: |
    - Klar definieren, was verglichen wird, warum es wichtig ist und welche Vergleichskriterien verwendet werden.
  comparison_section: |
    - Jeder Hauptabschnitt muss Alternativen nebeneinander vergleichen.
    - Dimensionsbasierte Analyse, explizite Kontraste, Tabellen und szenariobasierte Urteile verwenden.
    - Nicht in isolierte Themenzusammenfassungen abdriften.
    - Für jede Vergleichsdimension jedem Objekt eine quantitative Punktzahl (1-5) zuweisen. Punkte in einer Mini-Tabelle präsentieren.
    - Format: `| Kriterium | Option A | Option B | ... |` mit numerischen Punktzahlen.
  comparison_conclusion: |
    - Mit einem Urteil und einer Empfehlung nach Szenario, Einschränkung oder Priorität enden.
    - Auswahlhinweise explizit machen.
    - Eine **Bewertungszusammenfassungstabelle** einbeziehen, die alle dimensionsspezifischen Punkte in einer Tabelle zusammenfasst:
      `| Dimension | Option A | Option B | ... | (mit numerischen 1-5-Punkten)`
    - Unterhalb der Tabelle allgemeine gewichtete Eindrücke und szenariobasierte Empfehlungen angeben.
  comparison_single_pass: |
    - Die gesamte Ausgabe muss dimensionsorientiert, trade-off-lastig und empfehlungsorientiert sein.
    - Sie soll unverkennbar wie ein Vergleichsdokument wirken.
    - Quantitative 1-5-Punkte pro Dimension pro Option und eine Bewertungszusammenfassungstabelle in der Schlussfolgerung einbeziehen.
    - Das fertige Artefakt soll dem Leser helfen, eine Entscheidung unter expliziten Szenarien oder Einschränkungen zu treffen.

  learning_path_outline: |
    - Dieser Modus muss einen stufenweisen Lernfahrplan produzieren.
    - Die Gliederung nach Progression organisieren: Voraussetzungen, Stufe 1, Stufe 2, Stufe 3, Übung, Meilensteine, nächste Schritte.
    - Keine generischen thematischen Berichtskapitel als primäre Struktur verwenden.
  learning_path_introduction: |
    - Das Lernerprofil, Voraussetzungsannahmen und die erwartete Progression definieren.
    - Die Fahrplanabsicht von Anfang an deutlich machen.
  learning_path_section: |
    - Als Lernfahrplan schreiben, nicht als Bericht.
    - Sequenz, Voraussetzungen, Übungen, Kontrollpunkte, Meilensteine und was als nächstes zu lernen ist, explizit machen.
    - Jeder Abschnitt soll dem Lernenden helfen zu handeln, nicht nur zu verstehen.
    - Jeden Abschnitt mit Metadaten beginnen: `> ⏱️ **Geschätzte Zeit**: X Stunden` und `> 📊 **Schwierigkeitsgrad**: Grundlagen / Fortgeschritten / Experte`
    - Einen **Empfohlene Ressourcen**-Block einbeziehen: `> 📚 **Ressourcen**: [Bücher, Kurse, Tools oder Links]`
  learning_path_conclusion: |
    - Mit Meilenstein-Checks, Ratschlägen für nächste Schritte und wie man nach Abschluss des Pfads weitermacht enden.
    - Ein Mermaid-Fahrplan-Diagramm einbeziehen, das die Stufenprogression zeigt:
      ```mermaid
      graph LR
        A[Stufe 1: ...] --> B[Stufe 2: ...]
        B --> C[Stufe 3: ...]
      ```
    - Unterhalb des Diagramms die geschätzte Gesamtzeit und eine abschließende Kompetenz-Checkliste zusammenfassen.
  learning_path_single_pass: |
    - Die endgültige Ausgabe muss wie ein stufenweiser Studienplan mit Progressionslogik, Kontrollpunkten, Übungen und Sequenz wirken.
    - Jede Stufe muss geschätzte Zeit, Schwierigkeitsbezeichnung und empfohlene Ressourcen enthalten.
    - Mit einem Mermaid-Fahrplan-Diagramm und einer Gesamtzeitschätzung enden.
    - Das fertige Artefakt soll dem Lernenden helfen zu entscheiden, was zuerst, als nächstes zu tun ist und wie der Fortschritt beurteilt werden kann.

process:
  deduplicate: |
    Analysiere die folgende Themenliste und identifiziere doppelte oder sehr ähnliche Themen.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben, keinen weiteren Text, Erklärungen oder Code-Block-Markierungen.**

    Themenliste:
    {topics}

    Gesamtanzahl Themen: {total_topics}

    **Analyseschritte:**
    1. Den Kerninhalt und die Forschungsperspektive jedes Themas verstehen
    2. Semantisch doppelte oder sehr ähnliche Themen identifizieren (Hinweis: dasselbe Konzept aus verschiedenen Perspektiven ist KEINE Duplikation)
    3. Die repräsentativsten und inhaltsreichsten Themen behalten

    **Ausgabeformatanforderungen (strikt befolgen):**
    - Nur JSON-Objekt ausgeben, keinen ```json Code-Block-Wrapper verwenden
    - Keinen erklärenden Text hinzufügen
    - Sicherstellen, dass das JSON-Format vollständig gültig und direkt parsierbar ist

    Ausgabebeispiel (nur zur Formatreferenz, Inhalt nicht kopieren):
    {{
      "duplicates": [{{"indices": [0, 3], "reason": "Semantische Duplikation: beide behandeln grundlegende Prinzipien von XX"}}],
      "keep_indices": [0, 1, 2, 4],
      "summary": "4 komplementäre Themen beibehalten, die theoretische Grundlagen, technische Implementierung, Anwendungsszenarien und Grenzentwicklungen abdecken"
    }}

    **Jetzt direkt das JSON-Objekt ausgeben, keinen weiteren Inhalt einbeziehen.**

  generate_outline: |
    Erstelle eine strukturierte dreistufige Überschriftensystem-Gliederung für die folgende Forschung.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben, keinen weiteren Text, Erklärungen oder Code-Block-Markierungen.**

    Forschungsthema: {topic}

    Forschungsthemen (einschließlich Unterthema, Überblick und tool_summaries):
    {topics_json}

    Gesamtanzahl Themen: {total_topics}

    **Gliederungsdesignprinzipien**:

    1. **Dreistufiges Überschriftensystem**:
       - Ebene 1 (#): Berichthaupttitel
       - Ebene 2 (##): Hauptabschnitte (Einleitung, Kernabschnitte 1-N, Schlussfolgerung)
       - Ebene 3 (###): Unterabschnitte innerhalb jedes Abschnitts
       - Ebene 4 (####): Weitere Unterteilungen (optional, für komplexe Abschnitte)

    2. **Logisches Strukturdesign**:
       - Logische Beziehungen zwischen Themen identifizieren: Hierarchie, Abhängigkeit, Parallelität, Progression, Vergleich
       - Nach kognitivem Fluss ordnen: Konzept → Prinzipien → Methoden → Anwendungen → Bewertung → Ausblick
       - Klare Übergangslogik zwischen Abschnitten sicherstellen

    3. **Abschnittsdesign-Richtlinien**:
       - Jeder Hauptabschnitt soll eine klare Forschungsfrage oder ein klares Ziel haben
       - Unterabschnitte sollen Kerndimensionen des Themas abdecken
       - Anweisungen sollen wichtige einzubeziehende Elemente und den Darstellungsansatz spezifizieren

    **Ausgabeformatanforderungen (strikt befolgen):**
    - Nur JSON-Objekt ausgeben, keinen ```json Code-Block-Wrapper verwenden
    - Keinen erklärenden Text hinzufügen

    Ausgabebeispiel (nur zur Formatreferenz, Inhalt nicht kopieren):
    {{
      "title": "# Berichthaupttitel: Forschungsthema präzise ausdrücken",
      "introduction": "## Einleitung",
      "introduction_instruction": "Forschungshintergrund, Problemmotivation, Forschungsziele und Berichtsstruktur vorstellen",
      "sections": [
        {{
          "title": "## 1. Titel des ersten Hauptabschnitts",
          "instruction": "Dieser Abschnitt konzentriert sich auf... sollte Prinzipleitung und Schlüsselformeln einbeziehen",
          "block_id": "block_1",
          "subsections": [
            {{
              "title": "### 1.1 Unterabschnittstitel",
              "instruction": "Im Detail erläutern... Vergleichstabellen empfohlen"
            }},
            {{
              "title": "### 1.2 Unterabschnittstitel",
              "instruction": "Analysieren... Flussdiagramme empfohlen"
            }}
          ]
        }}
      ],
      "conclusion": "## Schlussfolgerung und zukünftige Richtungen",
      "conclusion_instruction": "Kernerkenntnisse, Forschungsbeiträge, Einschränkungen und zukünftige Richtungen zusammenfassen"
    }}

    **Jetzt direkt das JSON-Objekt ausgeben, keinen weiteren Inhalt einbeziehen.**

  write_introduction: |
    Schreibe den Einleitungsabschnitt des Forschungsberichts.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben, keinen weiteren Text, Erklärungen oder Code-Block-Markierungen.**

    Forschungsthema: {topic}
    Einleitungsleitfaden: {introduction_instruction}
    Überblick über Forschungsthemen: {topics_summary}
    Gesamtanzahl Themen: {total_topics}

    **Einleitungsschreib-Framework** (400-600 Wörter):

    1. **Eröffnungsaussage** (Absatz 1):
       - Mit makroökonomischem Hintergrund oder wichtigen Trends beginnen
       - Kernherausforderungen oder -chancen im Forschungsbereich einführen
       - Die Notwendigkeit und Dringlichkeit der Forschung hervorheben

    2. **Problemfokus** (Absatz 2):
       - Die spezifischen Probleme, die diese Forschung adressiert, klar benennen
       - Einschränkungen bestehender Methoden oder des Verständnisses erläutern
       - Kernforschungsziele einführen

    3. **Forschungsumfang** (Absatz 3):
       - Die wichtigsten von der Forschung abgedeckten Dimensionen skizzieren
       - Die logischen Beziehungen zwischen verschiedenen Teilen erläutern
       - Kernerkenntnisse oder Beiträge vorschau (optional)

    4. **Strukturleitfaden** (Absatz 4):
       - Die Organisation der Berichtsabschnitte kurz vorstellen
       - Lesern helfen, Leseerwartungen aufzubauen

    **Schreibanforderungen**:
    - Akademische, aber zugängliche Sprache verwenden
    - Jeder Absatz soll einen klaren Themensatz haben
    - Natürliche Übergänge zwischen Absätzen
    - Keine Abschnittsüberschriften verwenden, direkt Fließtext schreiben

    **Ausgabeformatanforderungen (strikt befolgen):**
    - Nur JSON-Objekt ausgeben, keinen ```json Code-Block-Wrapper verwenden
    - Sonderzeichen in JSON-Strings (wie Anführungszeichen, Zeilenumbrüche) müssen korrekt escaped werden

    Ausgabebeispiel:
    {{
        "introduction": "Vollständiger Einleitungsinhalt (Markdown-Format, ohne Überschrift, 400-600 Wörter)"
    }}

    **Jetzt direkt das JSON-Objekt ausgeben, keinen weiteren Inhalt einbeziehen.**

  write_section_body: |
    Tiefgreifenden Abschnittsinhalt basierend auf Forschungsdaten schreiben.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben, keinen weiteren Text, Erklärungen oder Code-Block-Markierungen.**

    Forschungsthema: {topic}
    Abschnittstitel: {section_title}
    Schreibleitfaden: {section_instruction}
    Datenquelle: {block_data}

    **Tiefes Schreib-Framework**:

    ## Schritt 1: Tiefgehende Materialanalyse

    1. **Informationsklassifizierung**:
       - **Kernschicht**: Schlüsseldefinitionen, Kernformeln, Hauptschlussfolgerungen → Vollständig darstellen
       - **Stützschicht**: Ableitungsprozesse, experimentelle Daten, Fallanalysen → Selektiv ausführen
       - **Hintergrundschicht**: Historische Entwicklung, verwandte Arbeiten → Kurz erwähnen

    2. **Bewertung der Informationsglaubwürdigkeit**:
       - Priorität: begutachtete Fachaufsätze > maßgebliche Lehrbücher > technische Dokumentation > Web-Ressourcen
       - Konfliktbehandlung: Verschiedene Standpunkte notieren oder die aktuellste/maßgeblichste Quelle wählen

    ## Schritt 2: Strukturierte Organisation

    **Dreistufiges Überschriftensystem** (muss befolgt werden):
    - `##` als Hauptabschnittsüberschrift verwenden
    - `###` zur Organisation von Unterthemen verwenden (2-4 ist ideal)
    - Komplexe Unterthemen können `####` für weitere Unterteilung verwenden

    **Logische Architekturmuster** (das am besten geeignete auswählen):
    - **Deduktiv**: Prinzipien → Folgerungen → Anwendungen → Validierung
    - **Induktiv**: Phänomene → Analyse → Muster → Theorie
    - **Vergleichend**: Methode A vs Methode B → Vor-/Nachteile-Analyse → Anwendbare Szenarien
    - **Problemorientiert**: Problem → Bestehende Lösungen → Einschränkungen → Verbesserungsideen

    ## Schritt 3: Verwendung multimodaler Elemente

    **Muss basierend auf Inhaltsmerkmalen folgende Elemente selektiv verwenden**:

    1. **Mathematische Formeln** (LaTeX-Format):
       - Inline-Formel: `$E = mc^2$`
       - Block-Formel:
         ```
         $$
         \mathcal{L} = \sum_{i=1}^{n} \ell(y_i, f(x_i)) + \lambda \Omega(f)
         $$
         ```
       - Anwendbar: Definitionen, Theoreme, Ableitungen, Optimierungsziele usw.

    2. **Tabellen** (Markdown-Format):
       - Anwendbar: mehrdimensionale Vergleiche, Parameterkonfigurationen, experimentelle Ergebnisse, Klassifizierungszusammenfassungen
       - Formatbeispiel:
         ```
         | Methode | Genauigkeit | Effizienz | Anwendungsfall |
         |---------|-------------|-----------|----------------|
         | A       | 95%         | Schnell   | Echtzeitsysteme |
         | B       | 98%         | Langsam   | Offline-Analyse |
         ```

    3. **Flussdiagramme** (Mermaid-Format):
       - Anwendbar: Algorithmusabläufe, Systemarchitekturen, Entscheidungslogik, Datenflüsse
       - Formatbeispiel:
         ```mermaid
         graph TD
             A[Eingabe] --> B{{Verarbeitung}}
             B --> C[Ausgabe]
         ```

    4. **Code-Blöcke**:
       - Anwendbar: Algorithmusimplementierungen, Konfigurationsbeispiele, API-Aufrufe
       - Sprachtyp muss angegeben werden (python/javascript/sql usw.)

    5. **Listen und Hierarchie**:
       - Geordnete Listen: Schritte, Rangfolgen, Prioritäten
       - Ungeordnete Listen: Merkmale, Elemente, Optionen
       - Verschachtelte Listen: hierarchische Beziehungen, Klassifizierungssysteme

    ## Schritt 4: Akademische Schreibstandards
    {citation_instruction}

    1. **Tiefes Paraphrasieren**:
       - Direktes Kopieren vermeiden, mit akademischer Sprache umformulieren
       - Beispieltransformation:
         - Original: „Methode X funktioniert gut"
         - Überarbeitet: „Experimentelle Ergebnisse zeigen, dass Methode X in Metrik Y eine signifikante Verbesserung erzielt, mit einer Z%igen Steigerung gegenüber dem Basisansatz"

    2. **Argumentationsvollständigkeit**:
       - Jeder Kernpunkt sollte haben: Behauptung → Belege → Analyse → Zusammenfassung
       - Geeignete Übergangssätze zur Verbindung von Absätzen verwenden

    3. **Umgang mit Fachterminologie**:
       - Bei Ersterwähnung Definition oder Erklärung bereitstellen
       - Format „Begriff (englisches Original)" kann verwendet werden

    **Ausgabeformatanforderungen (strikt befolgen):**
    - Nur JSON-Objekt ausgeben, keinen ```json Code-Block-Wrapper verwenden
    - Zeilenumbrüche in JSON-Strings sollen \n-Escape verwenden
    - Sicherstellen, dass das JSON-Format vollständig gültig ist

    Ausgabebeispiel:
    {{
        "section_content": "## Abschnittstitel\n\nEröffnungsabsatz...\n\n### 1.1 Unterabschnittstitel\n\nInhalt...\n\n### 1.2 Unterabschnittstitel\n\nInhalt...{citation_output_hint}"
    }}

    **Wortanzahlanforderung**: Jeder Abschnitt soll mindestens 800 Wörter umfassen, mit umfassender und gründlicher Diskussion

    **Jetzt direkt das JSON-Objekt ausgeben, keinen weiteren Inhalt einbeziehen.**

  write_conclusion: |
    Schreibe den Schlussfolgerungsabschnitt des Forschungsberichts.

    **Wichtig: Du musst nur ein gültiges JSON-Objekt ausgeben, keinen weiteren Text, Erklärungen oder Code-Block-Markierungen.**

    Forschungsthema: {topic}
    Schlussfolgerungsleitfaden: {conclusion_instruction}
    Wichtige Erkenntnisse: {topics_findings}
    Gesamtanzahl Themen: {total_topics}

    **Schlussfolgerungsschreib-Framework** (500-700 Wörter):

    1. **Forschungsrückblick und Kernerkenntnisse** (Absätze 1-2):
       - Forschungsfragen und -methoden kurz überblicken
       - Kernerkenntnisse aus jedem Kapitel systematisch zusammenfassen
       - Zu Gesamtschlussfolgerungen synthetisieren

    2. **Forschungsbeiträge und Wert** (Absatz 3):
       - **Theoretische Beiträge**: Fortschritte im Domänenverständnis
       - **Methodologische Beiträge**: Neue Methoden, Frameworks oder Tools
       - **Praktischer Wert**: Leitlinien für reale Anwendungen

    3. **Einschränkungen und Reflexionen** (Absatz 4):
       - Ehrlich auf Forschungseinschränkungen hinweisen
       - Einschränkungen von Daten, Methoden oder Umfang erläutern
       - Grenzen der Anwendbarkeit von Schlussfolgerungen angeben

    4. **Zukunftsausblick** (Absatz 5):
       - Offene zu lösende Probleme identifizieren
       - Wertvolle Forschungsrichtungen vorschlagen
       - Ausblick auf Entwicklungstrends im Bereich

    **Schreibanforderungen**:
    - Schlussfolgerung soll hochverdichtet sein, Textdetails nicht wiederholen
    - Kritisches Denken demonstrieren, Einschränkungen nicht vermeiden
    - Ausblick soll spezifisch und machbar sein, nicht allgemein
    - Keine Abschnittsüberschriften verwenden, direkt Fließtext schreiben

    **Ausgabeformatanforderungen (strikt befolgen):**
