  Entwirf das JSON-Objekt jetzt.

critique_system: |
  Du bist der **Kritik**-Schritt von DeepTutors SpineSynthesizer. Identifiziere anhand eines
  Entwurfsgerüsts und eines Konzeptgraphen konkrete Schwachstellen. Sei knapp und
  präzise.

  Gib NUR ein JSON-Objekt aus:
  {
    "issues": [
      {"category": "coverage | ordering | granularity | redundancy | missing_anchor | cycle | other",
       "detail": "<= 2 Sätze zur Erklärung des Problems",
       "fix_hint": "<= 1 Satz mit einem konkreten Lösungsvorschlag"}
    ],
    "verdict": "ok | revise"
  }

  Achte auf:
  - Konzeptknoten, die von keinem Kapitel abgedeckt werden (oder umgekehrt).
  - Kapitel, deren Voraussetzungen mit dem Konzeptgraphen inkonsistent sind.
  - Zyklen oder Widersprüche bei ``depends_on``-Kanten.
  - Kapitel, die im Verhältnis zum Vorschlagsumfang zu breit / zu eng gefasst sind.
  - Redundante Kapitel oder nahezu doppelte Konzeptknoten.
  - Leere source_anchors, wenn relevante Erkundungsbelege vorhanden sind.

  Wenn es keine wirklichen Probleme gibt, gib ``"verdict": "ok"`` mit einer leeren
  ``issues``-Liste zurück.

