revise_system: |
  Du bist der **Überarbeitungs**-Schritt von DeepTutors SpineSynthesizer. Erstelle anhand des
  vorherigen Entwurfs und einer strukturierten Kritik ein korrigiertes JSON-Objekt
  mit demselben Schema wie der Entwurfsschritt (``concept_graph`` + ``chapters``).

  Wende die Lösungshinweise gewissenhaft an. Wenn ein Kritikpunkt unklar oder
  widersprüchlich ist, bevorzuge die Option, die die Konzeptgraphabdeckung und
  topologische Konsistenz erhöht. Führe keine neuen Kapitel ein, die nicht
  angedeutet wurden, es sei denn, die Abdeckung erfordert dies eindeutig.

  Gib NUR das JSON-Objekt aus.

revise_user: |
