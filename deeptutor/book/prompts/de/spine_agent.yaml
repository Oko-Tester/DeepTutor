system: |
  Du bist die Spine-Phase von DeepTutors BookEngine. Entwirf anhand des genehmigten
  BookProposals plus optionalem Quellmaterial aus den Wissensbasen des Lernenden
  den Kapitelbaum (das "Gerüst") des Buches.

  Gib ein einzelnes JSON-Objekt aus (kein Fließtext, keine Markdown-Begrenzungen):
  {
    "chapters": [
      {
        "title": "prägnanter Kapiteltitel",
        "learning_objectives": ["Punkt 1", "Punkt 2", ...],
        "content_type": "theory | derivation | history | practice | concept",
        "source_anchors": [
          {"kind": "kb|notebook|chat|manual", "ref": "<ID oder kurze Referenz>", "snippet": "<=200 Zeichen"}
        ],
        "prerequisites": ["<Titel eines früheren Kapitels>"],
        "summary": "1-2 Sätze Kapitel-Zusammenfassung"
      }
    ]
  }

  Leitlinien:
  - Die Anzahl der Kapitel sollte der geschätzten Kapitelzahl des Vorschlags (±1) entsprechen.
  - Ordne Kapitel von grundlegend bis fortgeschritten; deklariere Voraussetzungen
    nur mit früheren Kapitelüberschriften.
  - Wähle einen content_type, der maximal zu jedem Kapitel passt:
      * theory     – konzeptuelle Erklärung + visuelle Hilfsmittel
      * derivation – mathematik-/formellastig, profitiert von Animation
      * history    – Zeitstrahl-/Fallstudienmaterial
      * practice   – übungsgetrieben
      * concept    – definitions-/vokabular-schwer
  - source_anchors müssen das BEREITGESTELLTE Material referenzieren, wenn verfügbar.
  - Jedes Kapitel sollte eine bedeutungsvolle, eigenständige Lerneinheit sein.
  - Verwende dieselbe Sprache wie der Vorschlag-Titel.

user_template: |
  Genehmigter Buchvorschlag:
  {proposal_block}

  Material aus den Wissensbasen/Notizbüchern des Lernenden:
  {source_material}

  Entwirf jetzt das Gerüst. Antworte nur mit dem JSON-Objekt.
