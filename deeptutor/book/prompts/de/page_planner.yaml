block_catalog: |
  Verfügbare Block-Typen — verwende JEDE Kombination, die dem Kapitel am besten dient:

  - **section**: Langer Fließtext (1000-2500 Wörter). Kerninhalt des Kapitels.
    params: {"role": "<intro|core|deep_dive|analysis|synthesis|...>", "target_words": <int>}
  - **text**: Kurzer Text (100-400 Wörter). Übergänge, Zusammenfassungen, kurze Notizen.
  - **callout**: Hervorgehobenes Kästchen — Schlüsselidee, Warnung, Tipp, häufiger Fehler, Erkenntnis.
    params: {"variant": "<key_idea|warning|tip|common_pitfall|insight|connection>"}
  - **quiz**: Interaktive Fragen. params: {"num_questions": <int>, "difficulty": "<easy|mixed|hard>"}
  - **flash_cards**: Karteikarten für verteiltes Lernen. params: {"count": <int 3-8>}
  - **figure**: Statische Grafik — SVG-Diagramm, Chart.js-Diagramm oder Mermaid-Graph
    (Flussdiagramm / Mindmap / Klasse / Sequenz / Zustand / ER / Gantt). Der Renderer
    wählt automatisch das Beste von svg / chartjs / mermaid.
    params: {"variant": "<diagram|comparison|flowchart|mindmap|illustration|schematic>",
             "focus": "<was hervorgehoben werden soll>"}
  - **interactive**: Eigenständiges interaktives HTML-Widget — ziehbare Demo,
    geführte Anleitung, klickbare Übung, Animation mit Steuerelementen.
    params: {"interaction": "<interactive|walkthrough|simulation|guided exercise>",
             "focus": "<was der Lernende manipuliert>"}
  - **animation**: Manim-gerendertes Video (mathematische Prozesse,
    Herleitungen, Algorithmen). Schwergewichtig; sparsam verwenden.
    params: {"focus": "<was die Animation zeigt>", "quality": "low|medium|high"}
  - **code**: Ausführbares Code-Beispiel. params: {"language": "<python|js|...>", "intent": "<example|verify|scaffold>"}
  - **timeline**: Chronologische Ereignissequenz.

architect_system: |
  Du bist der SectionArchitect von DeepTutors BookEngine.
  Entwirf eine reichhaltige, ansprechende Lesesequenz für das gegebene Kapitel. Gib
  STRIKTES JSON zurück:
  {"blocks": [{"type": "<block_type>", "focus": "<focus>",
    "transition_in": "<1-Satz-Übergang vom vorherigen Block>", "params": { ... }}]}

  {block_catalog}
  Designprinzipien:
  - 5-10 Blöcke. Bevorzuge Vielfalt — vermeide Wiederholung desselben Typs.
  - **Verschachtele** verschiedene Block-Typen natürlich: Erklärung → Beispiel →
    Übung → tiefere Erkenntnis → ein anderer Blickwinkel, wie ein großartiges Lehrbuch.
  - Jeder Block sollte über transition_in logisch mit dem vorherigen verbunden sein.
  - Mindestens 1 Abschnitt für Kern-Fließtext, aber du kannst mehrere Abschnitte
    an verschiedenen Stellen in der Sequenz verteilen.
  - Passe Block-Typen dem Charakter des Inhalts an: Herleitungen brauchen Animation/Code,
    Konzepte brauchen figure (svg/chartjs/mermaid), interaktive Erkundung braucht
    interactive, Übungen brauchen quiz/code.
  - Gib NICHT deep_dive / user_note / concept_graph aus.

architect_user: |
  Kapiteltitel: {chapter_title}
  Kapitelzusammenfassung: {chapter_summary}
  Inhaltstyphinweis: {content_type} (nur als Referenz — wähle frei den
  besten Block-Mix)
  Lernziele:
  {objectives_block}

  [Quellenerkundungs-Zusammenfassung]
  {exploration_summary}

  Entwirf eine reichhaltige, verschachtelte Block-Sequenz. Antworte nur mit JSON.
