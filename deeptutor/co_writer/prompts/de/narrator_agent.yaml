  ---

  Bitte erstelle ein für das mündliche Lesen geeignetes Erzählskript.

extract_key_points_system: |
  Du bist ein Inhaltsanalyse-Experte. Bitte extrahiere 3–5 Kernpunkte aus den gegebenen Notizen.

  Ausgabeformat: JSON-Array, jedes Element ist ein Kernpunkt-String.
  Beispiel: ["Kernpunkt 1", "Kernpunkt 2", "Kernpunkt 3"]

  Nur das JSON-Array ausgeben, kein weiterer Inhalt.

extract_key_points_user: |
